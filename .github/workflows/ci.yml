name: BranchLab checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: ruff check src tests
      - run: pytest -q
      - run: branchlab evaluate --output .branchlab/evaluation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fixture-evaluation
          path: .branchlab/evaluation
          retention-days: 7
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
  docker-execution:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: docker build -f docker/runner.Dockerfile -t branchlab-runner:0.1 .
      - run: branchlab demo --runner docker --repo .branchlab/docker-fixture
      - name: Require measured Docker results
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          reports = list(Path('.branchlab/runs').glob('*/report.json'))
          assert len(reports) == 1
          report = json.loads(reports[0].read_text())
          assert report['runner'] == 'docker'
          assert report['summary']['suspected_regression'] == 1, report['summary']
          assert report['summary']['intentional_change'] == 1, report['summary']
          assert report['summary']['no_regression'] == 1, report['summary']
          assert report['findings'][0]['minimization']['minimized_steps'] == 2
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-evidence
          path: .branchlab/runs
          retention-days: 7
